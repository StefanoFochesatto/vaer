<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="mineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="warmAirGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="coldAirGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="#080e1a" rx="12"/>

  <!-- Open Pit Mine Profile (Benched Cut) -->
  <path d="M 0 160 L 100 160 L 120 200 L 160 200 L 180 240 L 220 240 L 240 280 L 280 280 L 300 320 L 340 320 L 360 360 L 440 360 L 460 320 L 500 320 L 520 280 L 560 280 L 580 240 L 620 240 L 640 200 L 680 200 L 700 160 L 800 160 L 800 480 L 0 480 Z" fill="url(#mineGrad)" stroke="#475569" stroke-width="1.5"/>

  <!-- Trapped Cold Air Pool in Pit Floor (y=240 to 360) -->
  <path d="M 180 240 L 220 240 L 240 280 L 280 280 L 300 320 L 340 320 L 360 360 L 440 360 L 460 320 L 500 320 L 520 280 L 560 280 L 580 240 L 620 240 Z" fill="url(#coldAirGrad)" opacity="0.8"/>

  <!-- Trapped Stagnant Particulates (Haze / PM Dots) -->
  <g fill="#e2e8f0" opacity="0.4">
    <circle cx="320" cy="270" r="1.5"/><circle cx="350" cy="290" r="1.8"/><circle cx="390" cy="310" r="1.5"/>
    <circle cx="420" cy="280" r="2"/><circle cx="450" cy="300" r="1.5"/><circle cx="370" cy="330" r="1.8"/>
    <circle cx="400" cy="345" r="1.5"/><circle cx="300" cy="300" r="2"/><circle cx="470" cy="320" r="1.5"/>
  </g>

  <!-- Inversion Capping Boundary Layer (Warm lid above pit) -->
  <line x1="140" y1="230" x2="660" y2="230" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="665,230 655,225 655,235" fill="#ef4444"/>
  <text x="400" y="222" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="11" font-weight="bold">TEMPERATURE INVERSION CAP: dT/dz &gt; 0 (STRONG STABILITY)</text>

  <!-- Upper Atmosphere (Warm Subsidence Layer) -->
  <rect x="180" y="140" width="440" height="80" fill="url(#warmAirGrad)" opacity="0.5"/>
  <text x="400" y="170" text-anchor="middle" fill="#fb923c" font-family="system-ui, sans-serif" font-size="11">Anticyclonic Subsidence / High Pressure Ridge</text>
  <text x="400" y="188" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Decoupled Synoptic Flow (u &lt; 1.5 m/s)</text>

  <!-- Cold Pool Text -->
  <text x="400" y="285" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">TRAPPED SURFACE AIR POOL (-38°C)</text>
  <text x="400" y="302" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">High PM Concentration • Zero Ventilation</text>

  <!-- Thermodynamic Sounding Chart (Right Overlay) -->
  <g transform="translate(550, 40)">
    <rect width="220" height="180" rx="8" fill="#0f172a" stroke="#558ed5" stroke-width="1.2" opacity="0.95"/>
    <text x="16" y="24" fill="#558ed5" font-family="monospace" font-size="10" font-weight="bold">ATMOSPHERIC SOUNDING T(z)</text>
    <!-- Axes -->
    <line x1="30" y1="150" x2="190" y2="150" stroke="#475569" stroke-width="1"/>
    <line x1="30" y1="150" x2="30" y2="40" stroke="#475569" stroke-width="1"/>
    <text x="190" y="164" fill="#64748b" font-family="monospace" font-size="8">T (°C)</text>
    <text x="18" y="42" fill="#64748b" font-family="monospace" font-size="8">z</text>
    <!-- Temperature Profile Curve showing inversion inflection -->
    <path d="M 50 145 L 60 120 L 130 90 L 150 50" fill="none" stroke="#ef4444" stroke-width="2.5"/>
    <circle cx="60" cy="120" r="3.5" fill="#38bdf8"/>
    <circle cx="130" cy="90" r="3.5" fill="#ef4444"/>
    <text x="70" y="122" fill="#38bdf8" font-family="monospace" font-size="8">Pit Base</text>
    <text x="138" y="92" fill="#ef4444" font-family="monospace" font-size="8">Cap Peak</text>
    <text x="30" y="172" fill="#34d399" font-family="monospace" font-size="9">PROGNOSTIC DURATION: 36h ± 4h</text>
  </g>

  <!-- Left Program Title -->
  <g transform="translate(30, 40)">
    <rect width="240" height="65" rx="8" fill="#0f172a" stroke="#558ed5" stroke-width="1.2" opacity="0.95"/>
    <text x="14" y="22" fill="#558ed5" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">VAER ATMOSPHERE</text>
    <text x="14" y="38" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">High-Latitude Open-Pit Inversion Prognosis</text>
    <text x="14" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Alaska &amp; Canadian Subarctic Mining Support</text>
  </g>
</svg>