<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="33%" stop-color="#558ed5"/>
      <stop offset="66%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="nodeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131f38"/>
      <stop offset="100%" stop-color="#0c1527"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Connecting Flow Line -->
  <path d="M 150 180 L 1050 180" stroke="url(#cGrad)" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <path d="M 150 180 L 1050 180" stroke="url(#cGrad)" stroke-width="2" stroke-dasharray="8 8" stroke-linecap="round" opacity="0.9"/>

  <!-- Arrow heads / flow markers -->
  <polygon points="410,175 425,180 410,185" fill="#558ed5" />
  <polygon points="710,175 725,180 710,185" fill="#818cf8" />
  <polygon points="1010,175 1025,180 1010,185" fill="#34d399" />

  <!-- STAGE 1: SENSING -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="220" height="240" rx="12" fill="url(#nodeBg)" stroke="#38bdf8" stroke-width="1.5" opacity="0.95"/>
    <circle cx="110" cy="60" r="32" fill="#0c1527" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Sensor Icon -->
    <path d="M 110 38 L 110 82 M 94 50 L 126 50 M 98 62 L 122 62 M 102 74 L 118 74" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="110" cy="38" r="4" fill="#38bdf8"/>
    <text x="110" y="125" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">ADVANCED SENSING</text>
    <text x="110" y="150" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Custom Instrumentation</text>
    <text x="110" y="168" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Drone Profiling (P, T, RH)</text>
    <text x="110" y="186" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Aerosol PM1/2.5/10</text>
    <text x="110" y="214" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10">OBSERVE THE SYSTEM</text>
  </g>

  <!-- STAGE 2: COMPUTATIONAL PHYSICS -->
  <g transform="translate(350, 60)">
    <rect x="0" y="0" width="220" height="240" rx="12" fill="url(#nodeBg)" stroke="#558ed5" stroke-width="1.5" opacity="0.95"/>
    <circle cx="110" cy="60" r="32" fill="#0c1527" stroke="#558ed5" stroke-width="1.5"/>
    <!-- Physics Mesh / Wave Icon -->
    <path d="M 90 60 C 95 45, 105 75, 110 60 C 115 45, 125 75, 130 60" stroke="#558ed5" stroke-width="2" fill="none"/>
    <path d="M 92 70 C 97 58, 107 82, 112 70 C 117 58, 127 82, 132 70" stroke="#558ed5" stroke-width="1.5" opacity="0.5" fill="none"/>
    <line x1="95" y1="45" x2="125" y2="75" stroke="#558ed5" stroke-width="1" stroke-dasharray="2 2" opacity="0.7"/>
    <text x="110" y="125" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">COMPUTATIONAL PHYSICS</text>
    <text x="110" y="150" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Numerical Methods &amp; PDEs</text>
    <text x="110" y="168" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Data Assimilation (4D-Var)</text>
    <text x="110" y="186" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">High-Res Surface Winds</text>
    <text x="110" y="214" text-anchor="middle" fill="#558ed5" font-family="monospace" font-size="10">RECONSTRUCT &amp; MODEL</text>
  </g>

  <!-- STAGE 3: PREDICTIVE SYSTEMS -->
  <g transform="translate(650, 60)">
    <rect x="0" y="0" width="220" height="240" rx="12" fill="url(#nodeBg)" stroke="#818cf8" stroke-width="1.5" opacity="0.95"/>
    <circle cx="110" cy="60" r="32" fill="#0c1527" stroke="#818cf8" stroke-width="1.5"/>
    <!-- Forecast Cone Icon -->
    <path d="M 92 60 L 126 48 L 126 72 Z" fill="none" stroke="#818cf8" stroke-width="1.8"/>
    <line x1="92" y1="60" x2="126" y2="60" stroke="#818cf8" stroke-width="1" stroke-dasharray="2 2"/>
    <circle cx="92" cy="60" r="3" fill="#818cf8"/>
    <text x="110" y="125" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">PREDICTIVE SYSTEMS</text>
    <text x="110" y="150" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Integrated Alert Platforms</text>
    <text x="110" y="168" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Inversion Duration Models</text>
    <text x="110" y="186" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Risk Probability Envelopes</text>
    <text x="110" y="214" text-anchor="middle" fill="#818cf8" font-family="monospace" font-size="10">TRANSLATE GUIDANCE</text>
  </g>

  <!-- STAGE 4: OPERATIONAL DECISIONS -->
  <g transform="translate(950, 60)">
    <rect x="0" y="0" width="220" height="240" rx="12" fill="url(#nodeBg)" stroke="#34d399" stroke-width="1.5" opacity="0.95"/>
    <circle cx="110" cy="60" r="32" fill="#0c1527" stroke="#34d399" stroke-width="1.5"/>
    <!-- Decision Target / Action Icon -->
    <circle cx="110" cy="60" r="16" fill="none" stroke="#34d399" stroke-width="1.8"/>
    <circle cx="110" cy="60" r="7" fill="#34d399"/>
    <line x1="110" y1="38" x2="110" y2="44" stroke="#34d399" stroke-width="2"/>
    <line x1="110" y1="76" x2="110" y2="82" stroke="#34d399" stroke-width="2"/>
    <line x1="88" y1="60" x2="94" y2="60" stroke="#34d399" stroke-width="2"/>
    <line x1="126" y1="60" x2="132" y2="60" stroke="#34d399" stroke-width="2"/>
    <text x="110" y="125" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">OPERATIONAL ACTION</text>
    <text x="110" y="150" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Mine Shift Scheduling</text>
    <text x="110" y="168" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Avalanche Route Hazard</text>
    <text x="110" y="186" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Safety-Critical Action</text>
    <text x="110" y="214" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="10">INFORMED DECISIONS</text>
  </g>
</svg>